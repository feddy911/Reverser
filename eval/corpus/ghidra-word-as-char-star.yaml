id: ghidra-word-as-char-star
profile: gcc_pe_x64
recipe: sanitize
gcc_fingerprint: "invalid conversion from '(?:undefined8|longlong|long long unsigned int)'(?: \\{aka '[^']+'\\})? to 'char\\*'"
gcc_probe:
  - "invalid conversion from 'undefined8' {aka 'long long unsigned int'} to 'char*' [-fpermissive]"
  - "invalid conversion from 'long long unsigned int' to 'char*' [-fpermissive]"
ghidra_cpp: |
  void say_u(undefined8 w)
  {
    char *p;
    p = w;
  }
contains:
  - "p = w"
not_contains:
  - "c_str"
compile: false
notes: "Ghidra stores a stack word in a char* slot; do not invent c_str. Mix, not a sample name."
