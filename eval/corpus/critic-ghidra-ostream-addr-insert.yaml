id: critic-ghidra-ostream-addr-insert
profile: gcc_pe_x64
recipe: critic
guessed_name: wrap
ghidra_cpp: |
  void wrap(int n)
  {
    std::ostream *p;
    p = (std::ostream *)(&((*((std::ostream *)p)) << (n)));
    p = (&((*(std::cout)) << ("n")));
    (void)p;
  }
contains:
  - "==ghidra:ostream:"
not_contains:
  - "==0=="
compile: false
notes: "Ghidra takes the address of an inserter result and casts it back to ostream*, or derefs std::cout as if it were a pointer. That is decompiler this-pointer glue, not an insert a person wrote. Identity leftover like leftover in_RCX; sanitizer should emit std::cout << x / *p << x. Mix wrap. One class, not one spelling."
