id: ghidra-int7
profile: gcc_pe_x64
gcc_fingerprint: "'int7' was not declared"
gcc_probe:
  - "'int7' was not declared in this scope; did you mean 'int8'?"
recipe: sanitize
guessed_name: mix
ghidra_cpp: |
  unsigned long long mix(int7 x, char y)
  {
    return CONCAT71((int7)x, y);
  }
  unsigned long long put_lo(ulonglong w, char y)
  {
    return CONCAT71((int7)((ulonglong)w >> 8), y);
  }
  unsigned long long put_lo_exp(ulonglong w, char y)
  {
    return (((unsigned long long)((int7)((ulonglong)w >> 8)) << 8) | (unsigned char)(y));
  }
contains:
  - "<< 8"
  - "int7"
  - "& ~0xffull"
  - "(unsigned char)(y)"
not_contains:
  - "CONCAT71"
  - "struct int7"
  - "(int7)((ulonglong)w >> 8)"
compile: true
notes: "Ghidra 7-byte signed type; CONCAT71 may leave an int7 cast. CONCAT71((int7)(w >> 8), b) is replace-low-byte of w, not a human 7-byte value. Mix wrap."
