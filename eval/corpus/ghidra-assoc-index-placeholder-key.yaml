  - "no match for 'operator[]' (operand types are 'std::unordered_map<std::__cxx11::basic_string<char>, int, std::hash<std::__cxx11::basic_string<char> >, std::equal_to<std::__cxx11::basic_string<char> >, std::allocator<std::pair<const std::__cxx11::basic_string<char>, int> > >' and '__normal_iterator' {aka 'ghidra_word'})"
recipe: sanitize
ghidra_cpp: |
  void put_n(map<string,int,_std::less<string>,_std::allocator<std::pair<string_const,int>_>_> *m)
  {
    key_type *k;
    (void)std::map<string,int,_std::less<string>,_std::allocator<std::pair<string_const,int>_>_>::operator[](m, k);
