id: ghidra-extra-star-facts-permit
profile: gcc_pe_x64
recipe: sanitize
guessed_name: wrap
fn_facts:
  stack_alloc: 64
  lea_arg_slots: [-32]
  qword_store_slots: [-32]
ghidra_cpp: |
  void helper(longlong *out);
  void wrap(void)
  {
    longlong ***p;
    longlong ****xs[8];
    p = (longlong ***)xs;
    helper((longlong *)p);
    (void)xs[0];
  }
contains:
  - "longlong xs[8]"
  - "helper(xs)"
  - "(void)xs[0]"
not_contains:
  - "longlong ****"
  - "(longlong ***)xs"
  - "mpz"
compile: true
notes: "Facts permit the existing extra-star recipe (lea/qword out-param). Not a new dialect. Do not collapse [N]. Mix wrap. Not mpz_ptr."
