id: ghidra-msx64-concat-stack-ptr
profile: gcc_pe_x64
recipe: sanitize
ghidra_cpp: |
  struct Rec { int n; };
  void wrap(Rec *p)
  {
    uint in_stk_n72;
    undefined4 in_stk_n68;
    ((Rec *)CONCAT44(in_stk_n68, in_stk_n72))->n = 1;
  }
contains:
  - "p->n"
not_contains:
  - "CONCAT"
  - "in_stk_"
  - "<< 32"
compile: true
notes: "Microsoft x64 pointer is 8 bytes; Ghidra x86-64-win integer_size is 4, so the decompiler PIECE-splits the home and CONCAT44 later (little-endian). That reconstruction is the T* formal whether the pieces still look like in_stk or were already named as a formal/temp. Humans write the pointer; they do not rebuild it from two 4-byte parts. Mix wrap/Rec."
