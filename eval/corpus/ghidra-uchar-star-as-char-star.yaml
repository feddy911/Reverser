id: ghidra-uchar-star-as-char-star
profile: gcc_pe_x64
recipe: sanitize
gcc_fingerprint: "invalid conversion from 'unsigned char\\*' to 'char\\*'"
gcc_probe:
  - "invalid conversion from 'unsigned char*' to 'char*' [-fpermissive]"
ghidra_cpp: |
  void take_p(unsigned char *src, char **dst)
  {
    *dst = src;
  }
contains:
  - "*dst = src"
not_contains:
  - "reinterpret_cast"
  - "const_cast"
compile: false
notes: "Ghidra assigns unsigned char* into a char* slot; do not invent a cast. Mix, not a sample name."
