id: ghidra-msx64-concat-stack-piece-use
profile: gcc_pe_x64
recipe: sanitize
ghidra_cpp: |
  struct Rec { int n; };
  void use(Rec *q);
  void wrap(Rec *p)
  {
    uint in_stk_n72;
    undefined4 in_stk_n68;
    ((Rec *)CONCAT44(in_stk_n68, in_stk_n72))->n = 1;
    use(in_stk_n72);
  }
contains:
  - "p->n"
  - "use(p)"
not_contains:
  - "CONCAT"
  - "in_stk_"
  - "<< 32"
compile: true
notes: "Microsoft x64 pointer is 8 bytes; stack args are 8-byte aligned (Learn x64 calling convention / stack usage). Ghidra x86-64-win integer_size is 4, so it PIECE-splits the home and CONCAT44 later. A leftover 4-byte piece used as a value is still that pointer, not a new source operand."
