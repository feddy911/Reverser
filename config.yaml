# Путь к бинарнику, который анализируем
binary_path: samples/MyCollatz.exe

# Куда сохранять логи, артефакты, JSON-отчеты
output_dir: output

# Уровень логирования: DEBUG, INFO, WARNING, ERROR
log_level: INFO

# Кэшировать результаты анализа
use_cache: true

# Кандидаты: минимальный размер функции (байты)
min_function_size: 20

# Ghidra headless
ghidra_path: D:/Hryusha/Tools/ghidra
ghidra_timeout: 900

# Этап 3: LLM
hot_seed_score: 60
use_llm: true
ollama_url: http://127.0.0.1:11434
model_name: qwen2.5-coder:14b-instruct-q5_K_M
llm_num_ctx: 16384
llm_timeout: 900
llm_top: 13

scoring_mode: ml
ml_weights_path: output/ml_weights.json

polish: true

# Domain pack: none (произвольный бинарник) | mycollatz (эталон GMP/Collatz)
domain_pack: mycollatz
